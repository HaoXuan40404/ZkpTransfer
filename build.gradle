buildscript {
    ext {
        springBootVersion = '3.2.0'
    }
    repositories {
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'

    [compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'

    repositories {
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/jcenter' }
    }

    dependencies {
        implementation 'org.jetbrains:annotations:20.1.0'
        implementation 'org.projectlombok:lombok:1.18.24'
        annotationProcessor 'org.projectlombok:lombok:1.18.24'
        testImplementation 'org.springframework.boot:spring-boot-starter-test:2.7.18'
        testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    }

    configurations.all {
        resolutionStrategy {
            force 'org.slf4j:slf4j-api:1.7.36'
//            force 'org.apache.logging.log4j:log4j-api:2.17.1'
//            force 'org.apache.logging.log4j:log4j-core:2.17.1'
        }
    }

    tasks.withType(Copy).all {
        duplicatesStrategy 'exclude'
    }

    sourceSets {
        main {
            java {
                srcDir 'src/main/java'
            }
            resources {
                srcDir 'src/main/resources'
            }
        }
        test {
            java {
                srcDir "src/test/java"
            }
            resources {
                srcDir "src/test/resources"
            }
        }
    }

    jar {
        destinationDir file('dist/app')
        archiveName project.name + "-" + project.version + '.jar'
        exclude '**/*.yml'
        exclude '**/*.xml'
        exclude '**/*.properties'
        exclude '**/*.crt'
        exclude '**/*.key'
        exclude '**/*.pem'
        exclude '**/*.p12'

        doLast {
            copy {
                from file('src/main/resources/conf/')
                into 'dist/conf'
            }
            copy {
                from file('src/main/resources/').listFiles().findAll { File f -> (f.name.endsWith('.properties') || f.name.endsWith('.xml')) }
                into 'dist/conf'
            }
            copy {
                from configurations.runtimeClasspath
                into 'dist/libs'
            }
            copy {
                from file('script/')
                into 'dist/'
            }
            copy {
                from file('account')
                into 'dist/account'
            }
        }
    }
}