apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

configurations.configureEach {
    exclude group: "org.springframework.boot", module: "spring-boot-starter-logging"
    exclude group: "org.slf4j", module: "log4j-over-slf4j"
    exclude group: "org.apache.logging.log4j", module: "log4j-to-slf4j"
}

dependencies {
    def springboot_version = "3.2.0"

    implementation "org.springframework.boot:spring-boot-starter-web:$springboot_version"
    implementation "org.springframework.boot:spring-boot-starter-aop:$springboot_version"
    implementation "org.springframework.boot:spring-boot-starter-validation:$springboot_version"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa:$springboot_version"
    implementation("org.springframework.boot:spring-boot-starter-log4j2:$springboot_version")
    implementation 'io.springfox:springfox-boot-starter:3.0.0'
    implementation 'org.springframework.retry:spring-retry:1.3.3'
    implementation("org.fisco-bcos.java-sdk:fisco-bcos-java-sdk:3.2.0") {
        exclude group: 'org.slf4j'
    }
//    implementation("org.fisco-bcos.java-sdk:fisco-bcos-java-sdk:3.2.0")
    implementation 'com.mysql:mysql-connector-j:8.2.0'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.yaml:snakeyaml:2.0'
    implementation 'net.minidev:json-smart:2.4.9'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'commons-io:commons-io:2.7'
    implementation 'junit:junit:4.13.1'
    implementation 'com.jayway.jsonpath:json-path:2.9.0'
}